name: Build

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Build and deterministic regression (Xcode Cloud)
    environment: ${{ (github.event_name == 'pull_request_target' && github.event.pull_request.user.login == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository) && 'ci-trusted' || 'ci-approval' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      # Run orchestration from the trusted base, never from a contributor's PR.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install API authentication dependency
        run: python3 -m pip install 'PyJWT[crypto]==2.10.1'
      - name: Run approved Xcode Cloud regression
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          CLOUD_BUILD_WORKFLOW_ID: ${{ vars.CLOUD_BUILD_WORKFLOW_ID }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/xcode_cloud.py
