name: Build

on:
  # 功能分支经 PR 合入 develop，发布再经 PR 合入 main；只在 PR 时测试，
  # 避免同一提交被「推送」和「PR」各跑一遍、合并后推送 main 再跑一遍。
  # 推送版本标签时由 release.yml 负责构建。
  pull_request:
  workflow_dispatch:

# 同一个 PR 有新推送时，取消还在跑的旧运行。
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Xcode ${{ matrix.xcode }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 支持的最低工具链和日常 CI 工具链。
        xcode: ["26.2", "26.6"]
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode ${{ matrix.xcode }}
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Build
        run: |
          xcodebuild -version
          xcodebuild -project NeoBili.xcodeproj \
            -scheme NeoBili -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build

  regression:
    name: Deterministic regression (Xcode 26.6)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Select toolchain and simulator
        id: toolchain
        shell: bash
        run: |
          test -d /Applications/Xcode_26.6.app
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcrun simctl list devices available -j > "$RUNNER_TEMP/neobili-simulators.json"
          python3 - <<'PYTHON'
          import json, os
          with open(os.environ["RUNNER_TEMP"] + "/neobili-simulators.json") as source:
              devices = json.load(source)["devices"]
          candidates = [d for runtime, ds in devices.items() if runtime.endswith(".iOS-26-5")
                        for d in ds if d.get("isAvailable") and d["name"].startswith("iPhone")]
          if not candidates:
              raise SystemExit("Required iOS 26.5 iPhone Simulator is unavailable")
          device = sorted(candidates, key=lambda d: (d["name"], d["udid"]))[0]
          print("Selected", device["name"], device["udid"], "iOS 26.5")
          with open(os.environ["GITHUB_ENV"], "a") as target:
              target.write("NEOBILI_SIMULATOR_ID=" + device["udid"] + "\n")
          PYTHON
      - name: Offline regression
        shell: bash
        run: |
          mkdir -p DerivedData/Validation
          set -o pipefail
          zsh offline-harness/run.sh 2>&1 | tee DerivedData/Validation/offline.log
      - name: Simulator regression
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: bash scripts/simulator.sh test
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-results
          path: DerivedData/Validation/
          if-no-files-found: warn
          retention-days: 7
