name: Build

on:
  # 功能分支经 PR 合入 develop，发布再经 PR 合入 main；只在 PR 时测试，
  # 避免同一提交被「推送」和「PR」各跑一遍、合并后推送 main 再跑一遍。
  # 推送版本标签时由 release.yml 负责构建。
  pull_request:
  workflow_dispatch:

# 同一个 PR 有新推送时，取消还在跑的旧运行。
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 构建和回归合为一个任务：`verify.sh full` 本身就会编译 App、Domain/Core/Data 模块并跑完整测试。
  # 应用用到 iOS 27 SDK 的 API，所以只支持 Xcode 27；Xcode 27 目前在 `xcode-27` runner 上（预览）。
  regression:
    name: Build and deterministic regression (Xcode 27.1)
    # 仓库所有者在本仓库分支上提的 PR 使用没有保护规则的 ci-trusted，直接运行；
    # 其他 PR（含 fork）和手动运行使用 ci-approval，先等待审批。
    # ci-approval 的 required reviewers 在仓库 Settings → Environments 中维护。
    environment: ${{ (github.event_name == 'pull_request' && github.event.pull_request.user.login == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository) && 'ci-trusted' || 'ci-approval' }}
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Select toolchain and simulator
        id: toolchain
        shell: bash
        run: |
          test -d /Applications/Xcode_27.1.app
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
          xcrun simctl list devices available -j > "$RUNNER_TEMP/neobili-simulators.json"
          python3 - <<'PYTHON'
          import json, os
          with open(os.environ["RUNNER_TEMP"] + "/neobili-simulators.json") as source:
              devices = json.load(source)["devices"]
          # iOS 27.1 runtime 目前只带 iPhone Duo（折叠机型，没有顶部安全区），
          # 依赖真机顶部安全区的布局测试在它上面无法成立；与本地一致，用 iOS 27 的标准 iPhone。
          candidates = [(runtime, d) for runtime, ds in devices.items()
                        if runtime.endswith((".iOS-27-0", ".iOS-27-1"))
                        for d in ds if d.get("isAvailable") and d["name"].startswith("iPhone")
                        and "Duo" not in d["name"]]
          if not candidates:
              raise SystemExit("Required iOS 27 iPhone Simulator is unavailable")
          # 优先 iPhone 18 Pro，其次按名称、runtime、udid 稳定排序。
          runtime, device = sorted(candidates, key=lambda c: (c[1]["name"] != "iPhone 18 Pro", c[1]["name"], c[0], c[1]["udid"]))[0]
          print("Selected", device["name"], device["udid"], runtime.rsplit(".", 1)[-1])
          with open(os.environ["GITHUB_ENV"], "a") as target:
              target.write("NEOBILI_SIMULATOR_ID=" + device["udid"] + "\n")
          PYTHON
      - name: Full validation
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: bash scripts/verify.sh full
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-results
          path: DerivedData/Validation/
          if-no-files-found: warn
          retention-days: 7
