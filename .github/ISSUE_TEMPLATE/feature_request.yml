name: 功能建议 / Feature request
description: 希望新增或改进的功能 / Suggest a new feature or an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / The problem
      description: 你在什么场景下遇到了不便？ / What are you trying to do, and what gets in the way?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 希望的做法 / Proposed solution
      description: 你希望它怎么工作？可以参考官方客户端或其他应用 / How should it work? Referencing the official app or others is fine
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充信息 / Additional context
      description: 截图、示意图或其他说明 / Screenshots, mockups or anything else
