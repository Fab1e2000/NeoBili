name: NeoBili
configs:
  Debug: debug
  Regression: debug
  Release: release
options:
  bundleIdPrefix: com.elsterlee
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  # 界面文字以简体中文为源语言，英文翻译在 Localizable.xcstrings。
  developmentLanguage: zh-Hans

packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    version: 1.0.0

targets:
  NeoBili:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      # 每层自动同步；Domain、Core 纯工具与 Data 由独立模块编译。
      - path: NeoBili/App
        type: syncedFolder
      - path: NeoBili/Application
        type: syncedFolder
      - path: NeoBili/Core/UI
        type: syncedFolder
      - path: NeoBili/Core/Extensions
        type: syncedFolder
      - path: NeoBili/Core/Diagnostics
        type: syncedFolder
      - path: NeoBili/Features
        type: syncedFolder
      - path: NeoBili/Platform
        type: syncedFolder
      - path: NeoBili/Resources
        type: syncedFolder
    dependencies:
      - target: NeoBiliDomain
        embed: false
      - target: NeoBiliCore
        embed: false
      - target: NeoBiliData
        embed: false
      - package: MPVKit
        product: MPVKit
    info:
      path: NeoBili/Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true
        # 系统语言既不是中文也不是英文时，回退到英文。
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [zh-Hans, en]
        # 后台继续播放音频（退出视频页后的缩略播放器、锁屏）。
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        # 宋体风格使用的内置思源宋体（SIL OFL），随应用注册。
        UIAppFonts:
          - SourceHanSerifCN-Regular.otf
          - SourceHanSerifCN-SemiBold.otf
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleDisplayName: NeoBili
        CFBundleShortVersionString: "1.3.0"
        CFBundleVersion: "17"
        NSPhotoLibraryAddUsageDescription: 保存登录二维码到相册，便于在哔哩哔哩 App 的扫一扫里从相册识别登录。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    # 可选的本机真机签名设置不入库；模拟器仍使用默认设置。
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
      Regression: Config/Regression.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(NEOBILI_BUNDLE_IDENTIFIER)"
        SWIFT_VERSION: "6.0"
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: NeoBiliIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "NeoBiliIcon-rose NeoBiliIcon-ruby NeoBiliIcon-coral NeoBiliIcon-orange NeoBiliIcon-amber NeoBiliIcon-olive NeoBiliIcon-lime NeoBiliIcon-leaf NeoBiliIcon-forest NeoBiliIcon-jade NeoBiliIcon-teal NeoBiliIcon-cyan NeoBiliIcon-sky NeoBiliIcon-blue NeoBiliIcon-cobalt NeoBiliIcon-indigo NeoBiliIcon-violet NeoBiliIcon-lavender NeoBiliIcon-orchid NeoBiliIcon-berry NeoBiliIcon-cocoa NeoBiliIcon-slate NeoBiliIcon-graphite"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: "$(NEOBILI_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NEOBILI_DEVELOPMENT_TEAM)"
        CODE_SIGN_IDENTITY: "$(NEOBILI_CODE_SIGN_IDENTITY)"
        PROVISIONING_PROFILE_SPECIFIER: "$(NEOBILI_PROVISIONING_PROFILE)"

  NeoBiliDomain:
    type: framework
    platform: iOS
    sources:
      - path: NeoBili/Domain
        type: syncedFolder
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACH_O_TYPE: staticlib
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
      configs:
        Regression:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG NEOBILI_REGRESSION"

  NeoBiliCore:
    type: framework
    platform: iOS
    sources:
      - path: NeoBili/Core/Caching
        type: syncedFolder
      - path: NeoBili/Core/Formatting
        type: syncedFolder
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACH_O_TYPE: staticlib
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
      configs:
        Regression:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG NEOBILI_REGRESSION"

  NeoBiliData:
    type: framework
    platform: iOS
    sources:
      - path: NeoBili/Data
        type: syncedFolder
    dependencies:
      - target: NeoBiliDomain
        embed: false
      - target: NeoBiliCore
        embed: false
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACH_O_TYPE: staticlib
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Regression:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG NEOBILI_REGRESSION"

  NeoBiliTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: NeoBiliTests
        type: syncedFolder
    dependencies:
      - target: NeoBili
      - target: NeoBiliDomain
        embed: false
      - target: NeoBiliCore
        embed: false
      - target: NeoBiliData
        embed: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Regression:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG NEOBILI_REGRESSION"

# 共享运行方案：Debug + LLDB，重新生成工程时也保留。
schemes:
  NeoBili:
    build:
      targets:
        NeoBili: all
    run:
      config: Debug
      debugEnabled: true
    test:
      config: Regression
      testPlans:
        - path: Config/Regression.xctestplan
          defaultPlan: true
    profile:
      config: Release
    archive:
      config: Release

  NeoBili-Network:
    build:
      targets:
        NeoBili: all
    run:
      config: Debug
    test:
      config: Debug
      testPlans:
        - path: Config/Network.xctestplan
          defaultPlan: true
  NeoBili-Device:
    build:
      targets:
        NeoBili: all
    test:
      config: Debug
      testPlans:
        - path: Config/Device.xctestplan
          defaultPlan: true
