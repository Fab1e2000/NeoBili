name: NeoBili
configs:
  Debug: debug
  Regression: debug
  Release: release
options:
  bundleIdPrefix: com.elsterlee
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  # 界面文字以简体中文为源语言，英文翻译在 Localizable.xcstrings。
  developmentLanguage: zh-Hans

packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    version: 1.0.0

targets:
  NeoBili:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      # syncedFolder：Xcode 直接跟踪整个 NeoBili 文件夹。
      # 以后新增 .swift 文件会被自动编译，不需要再手动登记或重新生成项目。
      - path: NeoBili
        type: syncedFolder
    dependencies:
      - package: MPVKit
        product: MPVKit
    info:
      path: NeoBili/Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true
        # 系统语言既不是中文也不是英文时，回退到英文。
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [zh-Hans, en]
        # 后台继续播放音频（退出视频页后的缩略播放器、锁屏）。
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleDisplayName: NeoBili
        CFBundleShortVersionString: "1.3.0"
        CFBundleVersion: "13"
        NSPhotoLibraryAddUsageDescription: 保存登录二维码到相册，便于在哔哩哔哩 App 的扫一扫里从相册识别登录。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    # 可选的本机真机签名设置不入库；模拟器仍使用默认设置。
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
      Regression: Config/Regression.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(NEOBILI_BUNDLE_IDENTIFIER)"
        SWIFT_VERSION: "6.0"
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: NeoBiliIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "NeoBiliIcon-rose NeoBiliIcon-ruby NeoBiliIcon-coral NeoBiliIcon-orange NeoBiliIcon-amber NeoBiliIcon-olive NeoBiliIcon-lime NeoBiliIcon-leaf NeoBiliIcon-forest NeoBiliIcon-jade NeoBiliIcon-teal NeoBiliIcon-cyan NeoBiliIcon-sky NeoBiliIcon-blue NeoBiliIcon-cobalt NeoBiliIcon-indigo NeoBiliIcon-violet NeoBiliIcon-lavender NeoBiliIcon-orchid NeoBiliIcon-berry NeoBiliIcon-cocoa NeoBiliIcon-slate NeoBiliIcon-graphite"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: "$(NEOBILI_CODE_SIGN_STYLE)"
        DEVELOPMENT_TEAM: "$(NEOBILI_DEVELOPMENT_TEAM)"
        CODE_SIGN_IDENTITY: "$(NEOBILI_CODE_SIGN_IDENTITY)"
        PROVISIONING_PROFILE_SPECIFIER: "$(NEOBILI_PROVISIONING_PROFILE)"

  NeoBiliTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: NeoBiliTests
        type: syncedFolder
    dependencies:
      - target: NeoBili
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

# 共享运行方案：Debug + LLDB，重新生成工程时也保留。
schemes:
  NeoBili:
    build:
      targets:
        NeoBili: all
    run:
      config: Debug
      debugEnabled: true
    test:
      config: Regression
      testPlans:
        - path: Config/Regression.xctestplan
          defaultPlan: true
    profile:
      config: Release
    archive:
      config: Release

  NeoBili-Network:
    build:
      targets:
        NeoBili: all
    run:
      config: Debug
    test:
      config: Debug
      testPlans:
        - path: Config/Network.xctestplan
          defaultPlan: true
  NeoBili-Device:
    build:
      targets:
        NeoBili: all
    test:
      config: Debug
      testPlans:
        - path: Config/Device.xctestplan
          defaultPlan: true
