name: NeoBili
options:
  bundleIdPrefix: com.elsterlee
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  # 界面文字以简体中文为源语言，英文翻译在 Localizable.xcstrings。
  developmentLanguage: zh-Hans

packages:
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    version: 1.0.0

targets:
  NeoBili:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      # syncedFolder：Xcode 直接跟踪整个 NeoBili 文件夹。
      # 以后新增 .swift 文件会被自动编译，不需要再手动登记或重新生成项目。
      - path: NeoBili
        type: syncedFolder
    dependencies:
      - package: MPVKit
        product: MPVKit
    info:
      path: NeoBili/Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true
        # 系统语言既不是中文也不是英文时，回退到英文。
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [zh-Hans, en]
        # 后台继续播放音频（退出视频页后的缩略播放器、锁屏）。
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleDisplayName: NeoBili
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "8"
        NSPhotoLibraryAddUsageDescription: 保存登录二维码到相册，便于在哔哩哔哩 App 的扫一扫里从相册识别登录。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    # 生成一个共享的 Scheme，也就是 Xcode 左上角箭头旁边的那个运行方案。
    # 写进项目里之后，重新生成项目时它不会丢失。
    scheme:
      testTargets:
        - NeoBiliTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.elsterlee.NeoBili
        SWIFT_VERSION: "6.0"
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: NeoBiliIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "NeoBiliIcon-rose NeoBiliIcon-ruby NeoBiliIcon-coral NeoBiliIcon-orange NeoBiliIcon-amber NeoBiliIcon-olive NeoBiliIcon-lime NeoBiliIcon-leaf NeoBiliIcon-forest NeoBiliIcon-jade NeoBiliIcon-teal NeoBiliIcon-cyan NeoBiliIcon-sky NeoBiliIcon-blue NeoBiliIcon-cobalt NeoBiliIcon-indigo NeoBiliIcon-violet NeoBiliIcon-lavender NeoBiliIcon-orchid NeoBiliIcon-berry NeoBiliIcon-cocoa NeoBiliIcon-slate NeoBiliIcon-graphite"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: D6647H7B4X

  NeoBiliTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: NeoBiliTests
        type: syncedFolder
    dependencies:
      - target: NeoBili
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
